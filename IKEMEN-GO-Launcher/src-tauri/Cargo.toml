[package]
name = "ikemen_go_launcher"
version = "1.0.0"
description = "IKEMEN GO Launcher"
authors = ["Muttley Creations"]
edition = "2021"

[lib]
name = "ikemen_go_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
